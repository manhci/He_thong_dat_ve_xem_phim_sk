apiVersion: 1

contactPoints:
  - orgId: 1
    name: alert-sink
    receivers:
      - uid: alert-sink-receiver
        type: webhook
        settings:
          url: http://alert-sink:5001/webhook
          httpMethod: POST

policies:
  - orgId: 1
    receiver: alert-sink
    group_by: ['alertname']
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 1m

groups:
  - orgId: 1
    name: 'Cinema Security Alerts'
    folder: 'Cinema Monitoring'
    interval: 10s
    rules:
      - uid: cinema-bruteforce-alert
        title: 'Cinema - Brute force login'
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: 'Phát hiện tấn công dò mật khẩu (Brute Force) vào trang đăng nhập'
          description: 'Hệ thống ghi nhận hơn 5 lượt đăng nhập thất bại (LOGIN_FAILED) trong vòng 1 phút. Hướng dẫn truy vết: Sử dụng LogQL `{job="webapp"} |= "LOGIN_FAILED"` để xác định IP nguồn và tài khoản bị nhắm tới.'
        data:
          - refId: A
            queryType: range
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: loki-cinema-ds
            model:
              editorMode: code
              expr: 'sum(count_over_time({job="webapp"} |= "LOGIN_FAILED" [1m]))'
              queryType: range
              refId: A
          - refId: B
            datasourceUid: '__expr__'
            model:
              conditions: []
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: '__expr__'
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
