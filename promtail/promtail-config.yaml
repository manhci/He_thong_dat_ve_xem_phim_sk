server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=cinema"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'compose_service'
      - target_label: 'job'
        replacement: 'infrastructure'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'web'
        target_label: 'job'
        replacement: 'webapp'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'nginx'
        target_label: 'job'
        replacement: 'nginx'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'db'
        target_label: 'job'
        replacement: 'postgres'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'alert-sink'
        target_label: 'job'
        replacement: 'alert-sink'
    pipeline_stages:
      - match:
          selector: '{job="nginx"}'
          stages:
            - regex:
                expression: '^(?P<remote_addr>[\w\.]+) - (?P<remote_user>[^ ]*) \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d{3}) (?P<body_bytes_sent>\d+)'
