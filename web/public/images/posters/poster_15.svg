<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffbe0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="400" height="600" fill="url(#grad)" rx="16"/>
  <circle cx="200" cy="220" r="110" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  <polygon points="200,150 250,260 150,260" fill="rgba(255,255,255,0.2)"/>
  <rect x="30" y="30" width="140" height="32" rx="16" fill="rgba(0,0,0,0.5)"/>
  <text x="100" y="52" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Live Concert</text>
  <text x="200" y="420" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" filter="url(#shadow)">Lễ Hội Rock Trẻ</text>
  <line x1="80" y1="445" x2="320" y2="445" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <text x="200" y="480" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">CINEMA &amp; EVENT BOOKING</text>
  <text x="200" y="540" fill="rgba(255,255,255,0.6)" font-family="monospace" font-size="12" text-anchor="middle">★ ★ ★ ★ ★</text>
</svg>